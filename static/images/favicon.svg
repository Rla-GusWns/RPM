<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Reverse Playback Motion">
  <title>Reverse Playback Motion</title>
  <!-- UNO reverse card: blue face, tilted white oval, two opposing arrows. -->
  <rect width="100" height="100" rx="16" fill="#0052ba"/>
  <ellipse cx="50" cy="50" rx="32" ry="46" transform="rotate(-45 50 50)"
           fill="none" stroke="#ffffff" stroke-width="5"/>
  <g fill="#f4f4f4" stroke="#111111" stroke-width="4.5" stroke-linejoin="round">
    <path id="rev-arrow" d="M35.51 72.27 L58.13 49.65 L50.71 42.23 L76.87 40.11 L74.75 66.27 L67.33 58.85 L44.71 81.47 Z"/>
    <use href="#rev-arrow" transform="rotate(180 50 50)"/>
  </g>
</svg>
